file_format: definition/2
events:
  - name: gen_ai.client.inference.operation.details
    requirement_level: opt_in
    brief: >
      Describes the details of a GenAI completion request including chat history
      and parameters.
    note: >
      This event could be used to store input and output details
      independently from traces.
    stability: development
    attributes:
      - ref_group: span.gen_ai.inference.client
  - name: gen_ai.evaluation.result
    requirement_level: recommended
    brief: >
      This event captures the result of evaluating GenAI output for quality, accuracy, or other characteristics.
      This event SHOULD be parented to GenAI operation span being evaluated when possible
      or set `gen_ai.response.id` when span id is not available.
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref: gen_ai.evaluation.name
        requirement_level: required
      - ref: gen_ai.evaluation.score.value
        requirement_level:
          conditionally_required: If applicable.
      - ref: gen_ai.evaluation.score.label
        requirement_level:
          conditionally_required: If applicable.
      - ref: gen_ai.evaluation.explanation
        requirement_level: recommended
      - ref: gen_ai.response.id
        requirement_level:
          recommended: When available.
        note: |
          The unique identifier assigned to the specific
          completion being evaluated. This attribute helps correlate the evaluation
          event with the corresponding operation when span id is not available.

  - name: gen_ai.client.operation.exception
    requirement_level: recommended
    brief: >
      This event represents an exception that occurred during a Generative AI client operation,
      such as API errors, rate limiting, model errors, timeouts, or other errors that prevent
      the operation from completing successfully.
    note: >
      This event SHOULD be recorded when an exception occurs during Generative AI client operations.

      Instrumentations SHOULD set the severity to WARN (severity number 13) when recording this event.

      Instrumentations MAY provide a configuration option to populate exception events
      with the attributes captured on the corresponding Generative AI client span.
    stability: development
    attributes:
      - ref: exception.type
        requirement_level:
          conditionally_required: Required if `exception.message` is not set, recommended otherwise.
      - ref: exception.message
        requirement_level:
          conditionally_required: Required if `exception.type` is not set, recommended otherwise.
      - ref: exception.stacktrace
  - name: gen_ai.agent.paused
    requirement_level: recommended
    brief: >
      Agent execution paused awaiting an external condition, such as human
      approval, an external system, rate limiting, or a scheduled delay.
    note: >
      Records the suspension of a long-running or asynchronous agent
      execution. When a later `gen_ai.agent.resumed` or
      `gen_ai.agent.pause.resolved` event is expected to reference this
      boundary, instrumentations MUST record a `gen_ai.agent.pause.id` so the
      edge is expressible. A recorded pause with no subsequent resolution
      record is pending; see `gen_ai.agent.pause.resolution`.
    stability: development
    attributes:
      - ref: gen_ai.agent.execution.id
        requirement_level: required
      - ref: gen_ai.agent.pause.reason
        requirement_level: recommended
      - ref: gen_ai.agent.pause.id
        requirement_level:
          conditionally_required: >
            When a later `gen_ai.agent.resumed` or `gen_ai.agent.pause.resolved`
            event is expected to reference this boundary.
      - ref: gen_ai.agent.id
        requirement_level: recommended
      - ref: gen_ai.agent.name
        requirement_level: recommended

  - name: gen_ai.agent.checkpointed
    requirement_level: recommended
    brief: Agent state was persisted for durability or recovery.
    note: >
      Records the persistence of agent state such that execution can later
      continue from the persisted state, including across process restarts or
      in a different worker.
    stability: development
    attributes:
      - ref: gen_ai.agent.execution.id
        requirement_level: required
      - ref: gen_ai.agent.checkpoint.id
        requirement_level: required
      - ref: gen_ai.agent.id
        requirement_level: recommended
      - ref: gen_ai.agent.name
        requirement_level: recommended

  - name: gen_ai.agent.resumed
    requirement_level: recommended
    brief: Agent execution resumed after a suspended boundary.
    note: >
      When the resumed work begins a new active execution segment (after a
      process restart, durable recovery, resumption in a different worker, or
      when the prior segment was exported in a different trace),
      instrumentations MUST identify the suspended boundary the segment
      continues from via `gen_ai.agent.resumed_from.type` and
      `gen_ai.agent.resumed_from.id`, and MUST record the same
      `gen_ai.agent.execution.id` as the suspended segment. When resumption
      continues within the same still-open span, instrumentations SHOULD NOT
      record the `resumed_from` pair. The two attributes MUST be recorded
      together or not at all.

      For a pause that required a decision, the resolution and the resumed
      event record distinct facts: the resolution records the outcome, and a
      resumed event records that execution continued. After an `approved`
      resolution, a resumed segment follows if execution actually continues.
      After a `refused` or `expired` resolution the gated work does not
      continue; when the framework re-enters execution anyway, for example to
      record the outcome or run a decline path, instrumentations MAY emit a
      resumed event for that segment. Consumers MUST determine the outcome of
      a pause from its resolution record, never from the presence or absence
      of a resumed event.
    stability: development
    attributes:
      - ref: gen_ai.agent.execution.id
        requirement_level: required
      - ref: gen_ai.agent.resumed_from.type
        requirement_level:
          conditionally_required: When the resumed work begins a new active execution segment.
      - ref: gen_ai.agent.resumed_from.id
        requirement_level:
          conditionally_required: When the resumed work begins a new active execution segment.
      - ref: gen_ai.agent.id
        requirement_level: recommended
      - ref: gen_ai.agent.name
        requirement_level: recommended

  - name: gen_ai.agent.pause.resolved
    requirement_level: recommended
    brief: A pause reached its terminal outcome.
    note: >
      Records the terminal outcome of a pause as a first-class record rather
      than leaving it implicit. A `refused` resolution is not an error and
      instrumentations MUST NOT record it as one; `expired` means a
      configured deadline passed and this record says so.

      An `expired` resolution is a record of absence, not an inference from
      absence of record: instrumentations SHOULD emit it when the pause has a
      configured deadline and that deadline passes without a decision, and
      MUST NOT emit `expired` for a pause that has no configured deadline.
      The deadline itself is producer-local configuration and is not
      represented in telemetry; the requirement constrains producer behavior
      and is not validatable from the record alone. What unresolved silence
      means, for example a producer that died holding the pause, is consumer
      policy and is deliberately not defined by this vocabulary.
    stability: development
    attributes:
      - ref: gen_ai.agent.execution.id
        requirement_level: required
      - ref: gen_ai.agent.pause.id
        requirement_level: required
      - ref: gen_ai.agent.pause.resolution
        requirement_level: required
      - ref: gen_ai.agent.id
        requirement_level: recommended
      - ref: gen_ai.agent.name
        requirement_level: recommended
